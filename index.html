<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic & Neon Tic-Tac-Toe Master</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Classic Wood Theme Variables (Default) */
      --bg-main: #18110b;
      --bg-gradient: radial-gradient(circle at 50% 30%, #2e1d13 0%, #120b07 100%);
      --card-bg: rgba(42, 28, 19, 0.85);
      --card-border: rgba(217, 119, 6, 0.25);
      --cell-bg: rgba(26, 17, 11, 0.8);
      --cell-hover: rgba(56, 38, 26, 0.9);
      --accent-x: #e2b13c; /* Antique Gold */
      --accent-o: #cb4335; /* Crimson Red */
      --text-main: #f3e5d8;
      --font-family: 'Cinzel', serif, sans-serif;
    }

    body.theme-neon {
      --bg-main: #090d16;
      --bg-gradient: radial-gradient(circle at 15% 20%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
                      radial-gradient(circle at 85% 80%, rgba(255, 0, 127, 0.08) 0%, transparent 40%);
      --card-bg: rgba(21, 30, 49, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --cell-bg: rgba(15, 23, 42, 0.6);
      --cell-hover: rgba(30, 41, 59, 0.8);
      --accent-x: #00f3ff;
      --accent-o: #ff007f;
      --text-main: #f8fafc;
      --font-family: 'Outfit', sans-serif;
    }

    body.theme-chalk {
      --bg-main: #1c2421;
      --bg-gradient: radial-gradient(circle at 50% 50%, #28332f 0%, #121816 100%);
      --card-bg: rgba(30, 41, 37, 0.85);
      --card-border: rgba(255, 255, 255, 0.2);
      --cell-bg: rgba(20, 28, 25, 0.7);
      --cell-hover: rgba(45, 60, 54, 0.9);
      --accent-x: #ffffff;
      --accent-o: #5eead4;
      --text-main: #e2e8f0;
      --font-family: 'Outfit', sans-serif;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-main);
      background-image: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      user-select: none;
      transition: background 0.4s ease, color 0.4s ease;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }

    /* Cell Glowing & Hover States */
    .cell {
      position: relative;
      background: var(--cell-bg);
      border: 1.5px solid var(--card-border);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      aspect-ratio: 1 / 1;
    }

    .cell:hover:not(.occupied):not(.disabled) {
      border-color: var(--accent-x);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      background: var(--cell-hover);
    }

    .cell.occupied {
      cursor: default;
    }

    /* SVG Marker Draw Animations */
    .marker-svg path, .marker-svg circle {
      stroke-dasharray: 240;
      stroke-dashoffset: 240;
      animation: drawStroke 0.4s ease-out forwards;
    }

    @keyframes drawStroke {
      to {
        stroke-dashoffset: 0;
      }
    }

    .cell-x {
      color: var(--accent-x);
      border-color: var(--accent-x);
      box-shadow: inset 0 0 15px rgba(226, 177, 60, 0.15);
    }

    .cell-o {
      color: var(--accent-o);
      border-color: var(--accent-o);
      box-shadow: inset 0 0 15px rgba(203, 67, 53, 0.15);
    }

    .cell-winning {
      animation: pulseWin 1s infinite alternate;
    }

    .cell-x.cell-winning {
      background: rgba(226, 177, 60, 0.25);
      border-color: var(--accent-x);
      box-shadow: 0 0 30px rgba(226, 177, 60, 0.6);
    }

    .cell-o.cell-winning {
      background: rgba(203, 67, 53, 0.25);
      border-color: var(--accent-o);
      box-shadow: 0 0 30px rgba(203, 67, 53, 0.6);
    }

    @keyframes pulseWin {
      from { transform: scale(0.96); }
      to { transform: scale(1.04); }
    }

    /* Confetti Canvas overlay */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-4 sm:p-6 overflow-x-hidden">

  <canvas id="confettiCanvas"></canvas>

  <!-- Header Section -->
  <header class="w-full max-w-lg flex justify-between items-center mb-4">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-amber-700/40 border border-amber-500/40 flex items-center justify-center font-black text-xl shadow-lg text-amber-300">
        ♔
      </div>
      <h1 class="text-xl sm:text-2xl font-extrabold tracking-wider text-amber-200 uppercase">
        TIC-TAC-TOE
      </h1>
    </div>
    
    <!-- Audio Toggle & Reset Stats -->
    <div class="flex items-center space-x-2">
      <button id="audioBtn" class="p-2.5 rounded-xl glass-card hover:bg-amber-900/30 text-amber-200 transition flex items-center justify-center" title="Toggle Sound">
        <svg id="audioOnIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"/>
        </svg>
        <svg id="audioOffIcon" class="w-5 h-5 hidden text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
        </svg>
      </button>

      <button id="resetStatsBtn" class="p-2.5 rounded-xl glass-card hover:bg-amber-900/30 text-amber-200 transition flex items-center justify-center" title="Reset Scores">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="w-full max-w-md flex flex-col items-center space-y-4 my-auto">

    <!-- Game Settings Bar -->
    <div class="w-full glass-card rounded-2xl p-4 flex flex-col space-y-3">
      <!-- Mode Toggle -->
      <div class="flex bg-black/40 p-1 rounded-xl border border-white/10">
        <button id="modePvP" class="flex-1 py-2 rounded-lg text-xs sm:text-sm font-semibold transition bg-amber-500/20 text-amber-300 border border-amber-500/40 shadow-sm">
          👥 2 Players
        </button>
        <button id="modeAI" class="flex-1 py-2 rounded-lg text-xs sm:text-sm font-semibold transition text-slate-400 hover:text-slate-200">
          🤖 vs Computer
        </button>
      </div>

      <!-- Theme & Grid Controls Grid -->
      <div class="grid grid-cols-3 gap-2 text-xs">
        <!-- Visual Theme Selector -->
        <div class="flex flex-col space-y-1">
          <label class="text-amber-200/70 font-medium">Theme</label>
          <select id="themeSelect" class="bg-black/60 border border-amber-700/40 text-amber-200 rounded-lg p-2 focus:outline-none focus:border-amber-400">
            <option value="classic" selected>🪵 Classic Wood</option>
            <option value="chalk">✏️ Chalkboard</option>
            <option value="neon">⚡ Neon Glow</option>
          </select>
        </div>

        <!-- AI Difficulty Selector -->
        <div id="aiDiffContainer" class="flex flex-col space-y-1 opacity-50 pointer-events-none transition-all">
          <label class="text-amber-200/70 font-medium">Difficulty</label>
          <select id="aiDifficulty" class="bg-black/60 border border-amber-700/40 text-amber-200 rounded-lg p-2 focus:outline-none focus:border-amber-400">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="unbeatable" selected>Smart AI</option>
          </select>
        </div>

        <!-- Grid Size Selector (Includes 3x3, 4x4, 5x5) -->
        <div class="flex flex-col space-y-1">
          <label class="text-amber-200/70 font-medium">Grid Size</label>
          <select id="gridSizeSelect" class="bg-black/60 border border-amber-700/40 text-amber-200 rounded-lg p-2 focus:outline-none focus:border-amber-400">
            <option value="3" selected>Classic 3 x 3</option>
            <option value="4">Pro 4 x 4 (4 in row)</option>
            <option value="5">Master 5 x 5 (4 in row)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Scoreboard -->
    <div class="w-full grid grid-cols-3 gap-3 text-center">
      <!-- Player X -->
      <div id="playerXCard" class="glass-card rounded-2xl p-3 border-2 border-amber-500/50 transition-all duration-300 transform scale-105">
        <div id="playerXLabel" class="text-xs font-bold text-amber-400 tracking-wider uppercase mb-1">Player X</div>
        <div id="scoreX" class="text-2xl font-black text-amber-300">0</div>
      </div>

      <!-- Ties -->
      <div class="glass-card rounded-2xl p-3 border border-amber-900/40 flex flex-col justify-center">
        <div class="text-xs font-bold text-slate-400 tracking-wider uppercase mb-1">Draws</div>
        <div id="scoreTies" class="text-2xl font-black text-slate-200">0</div>
      </div>

      <!-- Player O / AI -->
      <div id="playerOCard" class="glass-card rounded-2xl p-3 border border-amber-900/40 transition-all duration-300">
        <div id="playerOLabel" class="text-xs font-bold text-red-400 tracking-wider uppercase mb-1">Player O</div>
        <div id="scoreO" class="text-2xl font-black text-red-300">0</div>
      </div>
    </div>

    <!-- Turn Banner -->
    <div id="turnBanner" class="w-full py-2.5 px-4 rounded-xl glass-card flex items-center justify-center space-x-2 text-sm font-semibold tracking-wide">
      <span class="text-slate-400">Turn:</span>
      <span id="turnIndicator" class="text-amber-400 font-extrabold flex items-center space-x-1">
        <span>Player X</span>
      </span>
    </div>

    <!-- Game Board Matrix Container -->
    <div id="boardContainer" class="w-full glass-card rounded-3xl p-4 sm:p-5 relative shadow-2xl">
      <div id="gridBoard" class="w-full">
        <!-- Cells generated dynamically by JS -->
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="w-full flex space-x-3">
      <button id="restartBtn" class="flex-1 py-3 px-6 rounded-xl bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-amber-950 font-extrabold tracking-wide shadow-lg shadow-amber-900/40 active:scale-95 transition transform flex items-center justify-center space-x-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        <span>NEW GAME</span>
      </button>
    </div>

  </main>

  <!-- Footer -->
  <footer class="mt-4 text-center text-xs text-amber-200/50">
    <p>Classic Tic-Tac-Toe • 3x3, 4x4, & 5x5 Board Engine</p>
  </footer>

  <script>
    class SoundEffects {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      initCtx() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playClick() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.08);

        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }

      playMove(isX) {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = isX ? 'triangle' : 'sine';
        
        const freq = isX ? 320 : 520;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, this.ctx.currentTime + 0.12);

        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
      }

      playWin() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);

          gain.gain.setValueAtTime(0.18, this.ctx.currentTime + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.1 + 0.3);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.1);
          osc.stop(this.ctx.currentTime + idx * 0.1 + 0.3);
        });
      }

      playDraw() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(150, this.ctx.currentTime + 0.3);

        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
      }
    }

    const sound = new SoundEffects();

    class ConfettiSystem {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.particles = [];
        this.animating = false;

        window.addEventListener('resize', () => this.resize());
        this.resize();
      }

      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }

      burst() {
        this.particles = [];
        const colors = ['#e2b13c', '#cb4335', '#00f3ff', '#ff007f', '#ffffff', '#f59e0b'];
        for (let i = 0; i < 90; i++) {
          this.particles.push({
            x: this.canvas.width / 2,
            y: this.canvas.height / 2,
            vx: (Math.random() - 0.5) * 14,
            vy: (Math.random() - 0.7) * 16,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: Math.random() * 8 + 4,
            rotation: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.2,
            alpha: 1
          });
        }

        if (!this.animating) {
          this.animating = true;
          this.animate();
        }
      }

      animate() {
        if (!this.animating) return;
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        this.particles.forEach((p, idx) => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.35; // gravity
          p.rotation += p.vRot;
          p.alpha -= 0.015;

          if (p.alpha > 0) {
            this.ctx.save();
            this.ctx.globalAlpha = p.alpha;
            this.ctx.translate(p.x, p.y);
            this.ctx.rotate(p.rotation);
            this.ctx.fillStyle = p.color;
            this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            this.ctx.restore();
          }
        });

        this.particles = this.particles.filter(p => p.alpha > 0);

        if (this.particles.length > 0) {
          requestAnimationFrame(() => this.animate());
        } else {
          this.animating = false;
        }
      }
    }

    const confetti = new ConfettiSystem('confettiCanvas');

    const state = {
      theme: 'classic',
      boardSize: 3,
      winningLength: 3, // 3 for 3x3, 4 for 4x4 and 5x5
      board: [],
      currentPlayer: 'X',
      gameActive: true,
      mode: 'pvp', // 'pvp' or 'ai'
      aiDifficulty: 'unbeatable',
      scores: { X: 0, O: 0, ties: 0 },
      isAiThinking: false
    };

    // DOM Elements
    const themeSelect = document.getElementById('themeSelect');
    const gridBoard = document.getElementById('gridBoard');
    const turnIndicator = document.getElementById('turnIndicator');
    const modePvP = document.getElementById('modePvP');
    const modeAI = document.getElementById('modeAI');
    const aiDiffContainer = document.getElementById('aiDiffContainer');
    const aiDifficultySelect = document.getElementById('aiDifficulty');
    const gridSizeSelect = document.getElementById('gridSizeSelect');
    const scoreXEl = document.getElementById('scoreX');
    const scoreOEl = document.getElementById('scoreO');
    const scoreTiesEl = document.getElementById('scoreTies');
    const playerXCard = document.getElementById('playerXCard');
    const playerOCard = document.getElementById('playerOCard');
    const playerOLabel = document.getElementById('playerOLabel');
    const restartBtn = document.getElementById('restartBtn');
    const resetStatsBtn = document.getElementById('resetStatsBtn');
    const audioBtn = document.getElementById('audioBtn');
    const audioOnIcon = document.getElementById('audioOnIcon');
    const audioOffIcon = document.getElementById('audioOffIcon');

    function applyTheme(themeName) {
      document.body.classList.remove('theme-neon', 'theme-chalk', 'theme-classic');
      if (themeName !== 'classic') {
        document.body.classList.add(`theme-${themeName}`);
      } else {
        document.body.classList.add('theme-classic');
      }
      state.theme = themeName;
    }

    themeSelect.addEventListener('change', (e) => {
      sound.playClick();
      applyTheme(e.target.value);
    });

    function initBoard() {
      state.boardSize = parseInt(gridSizeSelect.value, 10);
      state.winningLength = state.boardSize === 3 ? 3 : 4;
      state.board = Array(state.boardSize * state.boardSize).fill('');
      state.gameActive = true;
      state.currentPlayer = 'X';
      state.isAiThinking = false;

      // Dynamic CSS Grid Columns
      gridBoard.style.display = 'grid';
      gridBoard.style.gridTemplateColumns = `repeat(${state.boardSize}, minmax(0, 1fr))`;
      gridBoard.style.gap = state.boardSize >= 5 ? '0.4rem' : '0.65rem';

      // Font sizing depending on grid size
      const fontSizeClass = state.boardSize === 3 ? 'text-3xl' : (state.boardSize === 4 ? 'text-2xl' : 'text-xl');

      // Render Cells
      gridBoard.innerHTML = '';
      for (let i = 0; i < state.board.length; i++) {
        const cell = document.createElement('button');
        cell.className = `cell rounded-xl flex items-center justify-center font-bold ${fontSizeClass} focus:outline-none`;
        cell.dataset.index = i;
        cell.setAttribute('aria-label', `Cell ${i + 1}`);
        cell.addEventListener('click', () => handleCellClick(i));
        gridBoard.appendChild(cell);
      }

      updateTurnUI();
    }

    function updateTurnUI() {
      if (!state.gameActive) return;

      if (state.currentPlayer === 'X') {
        turnIndicator.innerHTML = `<span class="text-amber-400 font-bold">Player X's Turn</span>`;
        playerXCard.classList.add('border-2', 'border-amber-500/50', 'scale-105');
        playerOCard.classList.remove('border-2', 'border-red-500/50', 'scale-105');
      } else {
        const oName = state.mode === 'ai' ? 'Computer' : 'Player O';
        turnIndicator.innerHTML = `<span class="text-red-400 font-bold">${oName}'s Turn</span>`;
        playerOCard.classList.add('border-2', 'border-red-500/50', 'scale-105');
        playerXCard.classList.remove('border-2', 'border-amber-500/50', 'scale-105');
      }
    }

    function createXSVG() {
      return `
        <svg class="w-2/3 h-2/3 marker-svg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round">
          <path d="M 20,20 L 80,80" />
          <path d="M 80,20 L 20,80" />
        </svg>
      `;
    }

    function createOSVG() {
      return `
        <svg class="w-2/3 h-2/3 marker-svg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round">
          <circle cx="50" cy="50" r="32" />
        </svg>
      `;
    }

    function handleCellClick(index) {
      if (!state.gameActive || state.isAiThinking || state.board[index] !== '') {
        return;
      }

      makeMove(index, state.currentPlayer);

      if (state.gameActive && state.mode === 'ai' && state.currentPlayer === 'O') {
        triggerAiMove();
      }
    }

    function makeMove(index, player) {
      state.board[index] = player;
      const cell = gridBoard.children[index];
      cell.classList.add('occupied', player === 'X' ? 'cell-x' : 'cell-o');
      cell.innerHTML = player === 'X' ? createXSVG() : createOSVG();

      sound.playMove(player === 'X');

      const winLine = checkWin(state.board, state.boardSize, state.winningLength);

      if (winLine) {
        state.gameActive = false;
        highlightWinningCells(winLine);
        state.scores[player]++;
        updateScoreboard();
        
        const winnerName = player === 'X' ? 'Player X' : (state.mode === 'ai' ? 'Computer' : 'Player O');
        turnIndicator.innerHTML = `<span class="text-emerald-400 font-extrabold animate-bounce">🎉 ${winnerName} Wins!</span>`;
        sound.playWin();
        confetti.burst();
        return;
      }

      if (isBoardFull(state.board)) {
        state.gameActive = false;
        state.scores.ties++;
        updateScoreboard();
        turnIndicator.innerHTML = `<span class="text-slate-300 font-extrabold">🤝 Game Draw!</span>`;
        sound.playDraw();
        return;
      }

      // Switch turn
      state.currentPlayer = state.currentPlayer === 'X' ? 'O' : 'X';
      updateTurnUI();
    }

    function highlightWinningCells(winningIndices) {
      winningIndices.forEach(idx => {
        if (gridBoard.children[idx]) {
          gridBoard.children[idx].classList.add('cell-winning');
        }
      });
    }

    function isBoardFull(board) {
      return board.every(cell => cell !== '');
    }

    function updateScoreboard() {
      scoreXEl.textContent = state.scores.X;
      scoreOEl.textContent = state.scores.O;
      scoreTiesEl.textContent = state.scores.ties;
    }

    function checkWin(board, size, winLen) {
      const getIndex = (r, c) => r * size + c;

      // 1. Horizontal
      for (let r = 0; r < size; r++) {
        for (let c = 0; c <= size - winLen; c++) {
          const first = board[getIndex(r, c)];
          if (!first) continue;
          let match = true;
          const line = [];
          for (let k = 0; k < winLen; k++) {
            const idx = getIndex(r, c + k);
            line.push(idx);
            if (board[idx] !== first) {
              match = false;
              break;
            }
          }
          if (match) return line;
        }
      }

      // 2. Vertical
      for (let r = 0; r <= size - winLen; r++) {
        for (let c = 0; c < size; c++) {
          const first = board[getIndex(r, c)];
          if (!first) continue;
          let match = true;
          const line = [];
          for (let k = 0; k < winLen; k++) {
            const idx = getIndex(r + k, c);
            line.push(idx);
            if (board[idx] !== first) {
              match = false;
              break;
            }
          }
          if (match) return line;
        }
      }

      // 3. Diagonal Down-Right
      for (let r = 0; r <= size - winLen; r++) {
        for (let c = 0; c <= size - winLen; c++) {
          const first = board[getIndex(r, c)];
          if (!first) continue;
          let match = true;
          const line = [];
          for (let k = 0; k < winLen; k++) {
            const idx = getIndex(r + k, c + k);
            line.push(idx);
            if (board[idx] !== first) {
              match = false;
              break;
            }
          }
          if (match) return line;
        }
      }

      // 4. Diagonal Up-Right
      for (let r = winLen - 1; r < size; r++) {
        for (let c = 0; c <= size - winLen; c++) {
          const first = board[getIndex(r, c)];
          if (!first) continue;
          let match = true;
          const line = [];
          for (let k = 0; k < winLen; k++) {
            const idx = getIndex(r - k, c + k);
            line.push(idx);
            if (board[idx] !== first) {
              match = false;
              break;
            }
          }
          if (match) return line;
        }
      }

      return null;
    }

    function triggerAiMove() {
      state.isAiThinking = true;
      turnIndicator.innerHTML = `<span class="text-red-400 animate-pulse font-semibold">🤖 Computer thinking...</span>`;

      setTimeout(() => {
        if (!state.gameActive) return;

        let bestIndex = -1;

        if (state.aiDifficulty === 'easy') {
          bestIndex = getRandomMove();
        } else if (state.aiDifficulty === 'medium') {
          if (Math.random() > 0.4) {
            bestIndex = getSmartMove() ?? getRandomMove();
          } else {
            bestIndex = getRandomMove();
          }
        } else { // Smart AI
          if (state.boardSize === 3) {
            bestIndex = getMinimaxMove();
          } else {
            // Smart Heuristic Search for 4x4 and 5x5
            bestIndex = getSmartMove() ?? getRandomMove();
          }
        }

        state.isAiThinking = false;
        if (bestIndex !== -1 && bestIndex !== undefined) {
          makeMove(bestIndex, 'O');
        }
      }, 350);
    }

    function getRandomMove() {
      const emptyIndices = state.board
        .map((val, idx) => (val === '' ? idx : null))
        .filter(val => val !== null);

      if (emptyIndices.length === 0) return -1;
      return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
    }

    function getSmartMove() {
      // 1. Check if AI can win immediately
      for (let i = 0; i < state.board.length; i++) {
        if (state.board[i] === '') {
          state.board[i] = 'O';
          if (checkWin(state.board, state.boardSize, state.winningLength)) {
            state.board[i] = '';
            return i;
          }
          state.board[i] = '';
        }
      }

      // 2. Block opponent's immediate win
      for (let i = 0; i < state.board.length; i++) {
        if (state.board[i] === '') {
          state.board[i] = 'X';
          if (checkWin(state.board, state.boardSize, state.winningLength)) {
            state.board[i] = '';
            return i;
          }
          state.board[i] = '';
        }
      }

      // 3. Prefer Center positions
      const centerIndex = Math.floor(state.board.length / 2);
      if (state.board[centerIndex] === '') {
        return centerIndex;
      }

      return null;
    }

    function getMinimaxMove() {
      let bestScore = -Infinity;
      let move = -1;

      for (let i = 0; i < state.board.length; i++) {
        if (state.board[i] === '') {
          state.board[i] = 'O';
          let score = minimax(state.board, 0, false);
          state.board[i] = '';
          if (score > bestScore) {
            bestScore = score;
            move = i;
          }
        }
      }
      return move;
    }

    function minimax(board, depth, isMaximizing) {
      const winLine = checkWin(board, 3, 3);
      if (winLine) {
        const winner = board[winLine[0]];
        return winner === 'O' ? 10 - depth : depth - 10;
      }
      if (isBoardFull(board)) return 0;

      if (isMaximizing) {
        let bestScore = -Infinity;
        for (let i = 0; i < board.length; i++) {
          if (board[i] === '') {
            board[i] = 'O';
            let score = minimax(board, depth + 1, false);
            board[i] = '';
            bestScore = Math.max(score, bestScore);
          }
        }
        return bestScore;
      } else {
        let bestScore = Infinity;
        for (let i = 0; i < board.length; i++) {
          if (board[i] === '') {
            board[i] = 'X';
            let score = minimax(board, depth + 1, true);
            board[i] = '';
            bestScore = Math.min(score, bestScore);
          }
        }
        return bestScore;
      }
    }

    // Mode Switching
    modePvP.addEventListener('click', () => {
      sound.playClick();
      state.mode = 'pvp';
      modePvP.className = 'flex-1 py-2 rounded-lg text-xs sm:text-sm font-semibold transition bg-amber-500/20 text-amber-300 border border-amber-500/40 shadow-sm';
      modeAI.className = 'flex-1 py-2 rounded-lg text-xs sm:text-sm font-semibold transition text-slate-400 hover:text-slate-200';
      aiDiffContainer.classList.add('opacity-50', 'pointer-events-none');
      playerOLabel.textContent = 'Player O';
      initBoard();
    });

    modeAI.addEventListener('click', () => {
      sound.playClick();
      state.mode = 'ai';
      modeAI.className = 'flex-1 py-2 rounded-lg text-xs sm:text-sm font-semibold transition bg-amber-500/20 text-amber-300 border border-amber-500/40 shadow-sm';
      modePvP.className = 'flex-1 py-2 rounded-lg text-xs sm:text-sm font-semibold transition text-slate-400 hover:text-slate-200';
      aiDiffContainer.classList.remove('opacity-50', 'pointer-events-none');
      playerOLabel.textContent = 'Computer';
      initBoard();
    });

    // Difficulty and Grid Size
    aiDifficultySelect.addEventListener('change', (e) => {
      sound.playClick();
      state.aiDifficulty = e.target.value;
    });

    gridSizeSelect.addEventListener('change', () => {
      sound.playClick();
      initBoard();
    });

    // Buttons
    restartBtn.addEventListener('click', () => {
      sound.playClick();
      initBoard();
    });

    resetStatsBtn.addEventListener('click', () => {
      sound.playClick();
      state.scores = { X: 0, O: 0, ties: 0 };
      updateScoreboard();
    });

    audioBtn.addEventListener('click', () => {
      sound.muted = !sound.muted;
      if (sound.muted) {
        audioOnIcon.classList.add('hidden');
        audioOffIcon.classList.remove('hidden');
      } else {
        audioOnIcon.classList.remove('hidden');
        audioOffIcon.classList.add('hidden');
        sound.playClick();
      }
    });

    window.onload = () => {
      applyTheme('classic');
      initBoard();
    };
  </script>
</body>

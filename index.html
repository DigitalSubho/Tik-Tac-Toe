<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Tic-Tac-Toe Master</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan-neon: #00f3ff;
      --pink-neon: #ff007f;
      --yellow-neon: #ffeb3b;
      --bg-dark: #090d16;
      --card-bg: rgba(21, 30, 49, 0.75);
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(ff, 0, 127, 0.08) 0%, transparent 40%);
      color: #f8fafc;
      min-height: 100vh;
      user-select: none;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    /* Cell Glowing & Hover States */
    .cell {
      position: relative;
      background: rgba(15, 23, 42, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.08);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      aspect-ratio: 1 / 1;
    }

    .cell:hover:not(.occupied):not(.disabled) {
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      background: rgba(30, 41, 59, 0.8);
    }

    .cell.occupied {
      cursor: default;
    }

    /* SVG Marker Draw Animations */
    .marker-svg path {
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: drawStroke 0.4s ease-out forwards;
    }

    @keyframes drawStroke {
      to {
        stroke-dashoffset: 0;
      }
    }

    .cell-x {
      color: var(--cyan-neon);
      border-color: rgba(0, 243, 255, 0.3);
      box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.15);
    }

    .cell-o {
      color: var(--pink-neon);
      border-color: rgba(255, 0, 127, 0.3);
      box-shadow: inset 0 0 15px rgba(255, 0, 127, 0.15);
    }

    .cell-winning {
      animation: pulseWin 1s infinite alternate;
    }

    .cell-x.cell-winning {
      background: rgba(0, 243, 255, 0.25);
      border-color: var(--cyan-neon);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.6);
    }

    .cell-o.cell-winning {
      background: rgba(255, 0, 127, 0.25);
      border-color: var(--pink-neon);
      box-shadow: 0 0 30px rgba(255, 0, 127, 0.6);
    }

    @keyframes pulseWin {
      from { transform: scale(0.97); }
      to { transform: scale(1.03); }
    }

    /* Glowing Text Effects */
    .glow-cyan {
      text-shadow: 0 0 12px rgba(0, 243, 255, 0.7);
    }

    .glow-pink {
      text-shadow: 0 0 12px rgba(255, 0, 127, 0.7);
    }

    /* Confetti Canvas overlay */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-4 sm:p-6 overflow-x-hidden">

  <canvas id="confettiCanvas"></canvas>

  <!-- Header Section -->
  <header class="w-full max-w-lg flex justify-between items-center mb-4">
    <div class="flex items-center space-x-2">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 to-pink-500 flex items-center justify-center font-black text-xl shadow-lg">
        X
      </div>
      <h1 class="text-2xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-pink-500 to-yellow-400">
        NEON TIC-TAC-TOE
      </h1>
    </div>
    
    <!-- Sound Toggle & Reset Stats -->
    <div class="flex items-center space-x-2">
      <button id="audioBtn" class="p-2.5 rounded-xl glass-card hover:bg-slate-800 text-slate-300 hover:text-white transition flex items-center justify-center" title="Toggle Sound">
        <svg id="audioOnIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"/>
        </svg>
        <svg id="audioOffIcon" class="w-5 h-5 hidden text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
        </svg>
      </button>

      <button id="resetStatsBtn" class="p-2.5 rounded-xl glass-card hover:bg-slate-800 text-slate-300 hover:text-white transition flex items-center justify-center" title="Reset Scores">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Game Container -->
  <main class="w-full max-w-md flex flex-col items-center space-y-5 my-auto">

    <!-- Game Settings Bar -->
    <div class="w-full glass-card rounded-2xl p-4 flex flex-col space-y-3">
      <!-- Mode Toggle -->
      <div class="flex bg-slate-900/80 p-1 rounded-xl border border-slate-800">
        <button id="modePvP" class="flex-1 py-2 rounded-lg text-sm font-semibold transition bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 shadow-sm">
          👥 2 Players
        </button>
        <button id="modeAI" class="flex-1 py-2 rounded-lg text-sm font-semibold transition text-slate-400 hover:text-slate-200">
          🤖 vs Computer
        </button>
      </div>

      <!-- AI Options & Board Size Row -->
      <div class="grid grid-cols-2 gap-3 text-xs">
        <!-- AI Difficulty Selector -->
        <div id="aiDiffContainer" class="flex flex-col space-y-1 opacity-50 pointer-events-none transition-all">
          <label class="text-slate-400 font-medium">AI Difficulty</label>
          <select id="aiDifficulty" class="bg-slate-900 border border-slate-700 text-slate-200 rounded-lg p-2 focus:outline-none focus:border-cyan-400">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="unbeatable" selected>Unbeatable (Minimax)</option>
          </select>
        </div>

        <!-- Grid Size Selector -->
        <div class="flex flex-col space-y-1">
          <label class="text-slate-400 font-medium">Grid Size</label>
          <select id="gridSizeSelect" class="bg-slate-900 border border-slate-700 text-slate-200 rounded-lg p-2 focus:outline-none focus:border-cyan-400">
            <option value="3" selected>Classic 3 x 3</option>
            <option value="4">Pro 4 x 4 (Connect 4)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Scoreboard -->
    <div class="w-full grid grid-cols-3 gap-3 text-center">
      <!-- Player X -->
      <div id="playerXCard" class="glass-card rounded-2xl p-3 border-2 border-cyan-500/50 transition-all duration-300 transform scale-105">
        <div id="playerXLabel" class="text-xs font-bold text-cyan-400 tracking-wider uppercase mb-1">Player X</div>
        <div id="scoreX" class="text-2xl font-black text-cyan-300 glow-cyan">0</div>
      </div>

      <!-- Ties -->
      <div class="glass-card rounded-2xl p-3 border border-slate-800 flex flex-col justify-center">
        <div class="text-xs font-bold text-slate-400 tracking-wider uppercase mb-1">Draws</div>
        <div id="scoreTies" class="text-2xl font-black text-slate-200">0</div>
      </div>

      <!-- Player O / AI -->
      <div id="playerOCard" class="glass-card rounded-2xl p-3 border border-slate-800 transition-all duration-300">
        <div id="playerOLabel" class="text-xs font-bold text-pink-400 tracking-wider uppercase mb-1">Player O</div>
        <div id="scoreO" class="text-2xl font-black text-pink-300">0</div>
      </div>
    </div>

    <!-- Turn Banner -->
    <div id="turnBanner" class="w-full py-2.5 px-4 rounded-xl glass-card flex items-center justify-center space-x-2 text-sm font-semibold tracking-wide">
      <span class="text-slate-400">Turn:</span>
      <span id="turnIndicator" class="text-cyan-400 font-extrabold glow-cyan flex items-center space-x-1">
        <span>Player X</span>
      </span>
    </div>

    <!-- Game Board Matrix Container -->
    <div id="boardContainer" class="w-full glass-card rounded-3xl p-4 sm:p-5 relative shadow-2xl">
      <div id="gridBoard" class="grid grid-cols-3 gap-3 w-full">
        <!-- Cells generated dynamically by JS -->
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="w-full flex space-x-3">
      <button id="restartBtn" class="flex-1 py-3 px-6 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-extrabold tracking-wide shadow-lg shadow-cyan-500/20 active:scale-95 transition transform flex items-center justify-center space-x-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        <span>NEW GAME</span>
      </button>
    </div>

  </main>

  <!-- Footer -->
  <footer class="mt-6 text-center text-xs text-slate-500">
    <p>Neon Tic-Tac-Toe • Built with HTML5, CSS3 & Modern JavaScript</p>
  </footer>

  <script>
    /* ==========================================
       1. AUDIO SYNTHESIZER (Web Audio API)
       ========================================== */
    class SoundEffects {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
      }

      playTone(freq, type, duration, gainValue = 0.1) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

          gain.gain.setValueAtTime(gainValue, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          console.error("Audio playback error", e);
        }
      }

      playX() {
        // High crisp double tone
        this.playTone(523.25, 'triangle', 0.1, 0.15); // C5
        setTimeout(() => this.playTone(659.25, 'sine', 0.15, 0.12), 50); // E5
      }

      playO() {
        // Warm deep resonant tone
        this.playTone(329.63, 'sine', 0.15, 0.2); // E4
        setTimeout(() => this.playTone(261.63, 'sine', 0.2, 0.18), 50); // C4
      }

      playWin() {
        // Victory fanfare arpeggio
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 'triangle', 0.3, 0.2), idx * 90);
        });
      }

      playDraw() {
        // Descending tie tone
        const notes = [350, 320, 290, 260];
        notes.forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 'sawtooth', 0.2, 0.08), idx * 80);
        });
      }

      playClick() {
        this.playTone(800, 'sine', 0.03, 0.05);
      }
    }

    const sound = new SoundEffects();

    /* ==========================================
       2. CONFETTI PARTICLE SYSTEM
       ========================================== */
    class ConfettiSystem {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.particles = [];
        this.animating = false;

        this.resize();
        window.addEventListener('resize', () => this.resize());
      }

      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }

      trigger() {
        this.particles = [];
        const colors = ['#00f3ff', '#ff007f', '#ffeb3b', '#3b82f6', '#10b981'];

        for (let i = 0; i < 120; i++) {
          this.particles.push({
            x: this.canvas.width / 2,
            y: this.canvas.height / 2,
            vx: (Math.random() - 0.5) * 18,
            vy: (Math.random() - 0.7) * 18,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: Math.random() * 8 + 4,
            rotation: Math.random() * 360,
            rotationSpeed: (Math.random() - 0.5) * 10,
            gravity: 0.3,
            opacity: 1
          });
        }

        if (!this.animating) {
          this.animating = true;
          this.loop();
        }
      }

      loop() {
        if (!this.animating) return;

        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        this.particles.forEach((p, idx) => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.rotation += p.rotationSpeed;
          p.opacity -= 0.008;

          this.ctx.save();
          this.ctx.translate(p.x, p.y);
          this.ctx.rotate((p.rotation * Math.PI) / 180);
          this.ctx.globalAlpha = Math.max(0, p.opacity);
          this.ctx.fillStyle = p.color;
          this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          this.ctx.restore();
        });

        this.particles = this.particles.filter(p => p.opacity > 0);

        if (this.particles.length > 0) {
          requestAnimationFrame(() => this.loop());
        } else {
          this.animating = false;
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        }
      }
    }

    const confetti = new ConfettiSystem('confettiCanvas');

    /* ==========================================
       3. GAME ENGINE & STATE MANAGEMENT
       ========================================== */
    const state = {
      boardSize: 3,
      winningLength: 3, // 3 for 3x3, 4 for 4x4
      board: [],
      currentPlayer: 'X', // 'X' or 'O'
      gameActive: true,
      mode: 'pvp', // 'pvp' or 'ai'
      aiDifficulty: 'unbeatable', // 'easy', 'medium', 'unbeatable'
      scores: { X: 0, O: 0, ties: 0 },
      isAiThinking: false
    };

    // DOM Elements
    const gridBoard = document.getElementById('gridBoard');
    const turnIndicator = document.getElementById('turnIndicator');
    const modePvP = document.getElementById('modePvP');
    const modeAI = document.getElementById('modeAI');
    const aiDiffContainer = document.getElementById('aiDiffContainer');
    const aiDifficultySelect = document.getElementById('aiDifficulty');
    const gridSizeSelect = document.getElementById('gridSizeSelect');
    const scoreXEl = document.getElementById('scoreX');
    const scoreOEl = document.getElementById('scoreO');
    const scoreTiesEl = document.getElementById('scoreTies');
    const playerXCard = document.getElementById('playerXCard');
    const playerOCard = document.getElementById('playerOCard');
    const playerOLabel = document.getElementById('playerOLabel');
    const restartBtn = document.getElementById('restartBtn');
    const resetStatsBtn = document.getElementById('resetStatsBtn');
    const audioBtn = document.getElementById('audioBtn');
    const audioOnIcon = document.getElementById('audioOnIcon');
    const audioOffIcon = document.getElementById('audioOffIcon');

    // SVG Marker Templates
    const SVG_X = `
      <svg class="w-2/3 h-2/3 marker-svg" viewBox="0 0 100 100">
        <path d="M 20,20 L 80,80 M 80,20 L 20,80" stroke="currentColor" stroke-width="14" stroke-linecap="round" fill="none" />
      </svg>
    `;

    const SVG_O = `
      <svg class="w-2/3 h-2/3 marker-svg" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="32" stroke="currentColor" stroke-width="14" stroke-linecap="round" fill="none" />
      </svg>
    `;

    // Initialize Board Grid
    function initBoard() {
      state.boardSize = parseInt(gridSizeSelect.value, 10);
      state.winningLength = state.boardSize === 3 ? 3 : 4;
      state.board = Array(state.boardSize * state.boardSize).fill('');
      state.gameActive = true;
      state.currentPlayer = 'X';
      state.isAiThinking = false;

      // Update CSS Grid Layout
      gridBoard.className = `grid gap-2.5 sm:gap-3 w-full ${
        state.boardSize === 3 ? 'grid-cols-3' : 'grid-cols-4'
      }`;

      // Render Cells
      gridBoard.innerHTML = '';
      for (let i = 0; i < state.board.length; i++) {
        const cell = document.createElement('button');
        cell.className = 'cell rounded-2xl flex items-center justify-center font-bold text-3xl focus:outline-none';
        cell.dataset.index = i;
        cell.setAttribute('aria-label', `Cell ${i + 1}`);
        cell.addEventListener('click', () => handleCellClick(i));
        gridBoard.appendChild(cell);
      }

      updateTurnUI();
    }

    function updateTurnUI() {
      if (state.currentPlayer === 'X') {
        turnIndicator.innerHTML = `<span class="text-cyan-400 glow-cyan">Player X's Turn</span>`;
        playerXCard.classList.add('border-2', 'border-cyan-500/50', 'scale-105');
        playerOCard.classList.remove('border-2', 'border-pink-500/50', 'scale-105');
      } else {
        const oName = state.mode === 'ai' ? 'Computer' : 'Player O';
        turnIndicator.innerHTML = `<span class="text-pink-400 glow-pink">${oName}'s Turn</span>`;
        playerOCard.classList.add('border-2', 'border-pink-500/50', 'scale-105');
        playerXCard.classList.remove('border-2', 'border-cyan-500/50', 'scale-105');
      }
    }

    function handleCellClick(index) {
      if (!state.gameActive || state.board[index] !== '' || state.isAiThinking) return;

      makeMove(index, state.currentPlayer);

      if (state.gameActive && state.mode === 'ai' && state.currentPlayer === 'O') {
        triggerAiMove();
      }
    }

    function makeMove(index, player) {
      state.board[index] = player;
      const cell = gridBoard.children[index];
      cell.classList.add('occupied', player === 'X' ? 'cell-x' : 'cell-o');
      cell.innerHTML = player === 'X' ? SVG_X : SVG_O;

      if (player === 'X') sound.playX();
      else sound.playO();

      const winResult = checkWin(state.board, state.boardSize, state.winningLength);

      if (winResult) {
        handleWin(winResult, player);
      } else if (state.board.every(c => c !== '')) {
        handleDraw();
      } else {
        state.currentPlayer = state.currentPlayer === 'X' ? 'O' : 'X';
        updateTurnUI();
      }
    }

    // Dynamic Win Checker for 3x3 (3 in a row) and 4x4 (4 in a row)
    function checkWin(board, size, reqLength) {
      const getIndex = (r, c) => r * size + c;

      // Directions: [rowStep, colStep] -> Horizontal, Vertical, Diagonal-Right, Diagonal-Left
      const directions = [
        [0, 1],   // Row
        [1, 0],   // Column
        [1, 1],   // Main diagonal
        [1, -1]   // Anti diagonal
      ];

      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const player = board[getIndex(r, c)];
          if (!player) continue;

          for (const [dr, dc] of directions) {
            const line = [];
            for (let k = 0; k < reqLength; k++) {
              const nr = r + dr * k;
              const nc = c + dc * k;
              if (nr >= 0 && nr < size && nc >= 0 && nc < size) {
                if (board[getIndex(nr, nc)] === player) {
                  line.push(getIndex(nr, nc));
                } else {
                  break;
                }
              } else {
                break;
              }
            }

            if (line.length === reqLength) {
              return { winner: player, line };
            }
          }
        }
      }

      return null;
    }

    function handleWin(winResult, winner) {
      state.gameActive = false;
      state.scores[winner]++;
      updateScoresUI();

      // Highlight winning cells
      winResult.line.forEach(idx => {
        gridBoard.children[idx].classList.add('cell-winning');
      });

      const winnerName = winner === 'X' ? 'Player X' : (state.mode === 'ai' ? 'Computer' : 'Player O');
      const glowClass = winner === 'X' ? 'text-cyan-400 glow-cyan' : 'text-pink-400 glow-pink';
      
      turnIndicator.innerHTML = `<span class="${glowClass}">🎉 ${winnerName} Wins!</span>`;
      
      sound.playWin();
      confetti.trigger();
    }

    function handleDraw() {
      state.gameActive = false;
      state.scores.ties++;
      updateScoresUI();
      turnIndicator.innerHTML = `<span class="text-yellow-400 glow-yellow">🤝 It's a Tie!</span>`;
      sound.playDraw();
    }

    function updateScoresUI() {
      scoreXEl.textContent = state.scores.X;
      scoreOEl.textContent = state.scores.O;
      scoreTiesEl.textContent = state.scores.ties;
    }

    /* ==========================================
       4. AI ENGINE (Minimax & Heuristics)
       ========================================== */
    function triggerAiMove() {
      state.isAiThinking = true;
      turnIndicator.innerHTML = `<span class="text-pink-400 animate-pulse">🤖 Computer thinking...</span>`;

      setTimeout(() => {
        if (!state.gameActive) return;

        let bestIndex = -1;

        if (state.aiDifficulty === 'easy') {
          bestIndex = getRandomMove();
        } else if (state.aiDifficulty === 'medium') {
          // 50% chance optimal, 50% chance random
          if (Math.random() > 0.4) {
            bestIndex = getSmartMove() ?? getRandomMove();
          } else {
            bestIndex = getRandomMove();
          }
        } else { // Unbeatable
          if (state.boardSize === 3) {
            bestIndex = getMinimaxMove();
          } else {
            // For 4x4, minimax is deeper, use heuristic depth-limited minimax
            bestIndex = getSmartMove() ?? getRandomMove();
          }
        }

        state.isAiThinking = false;
        if (bestIndex !== -1 && bestIndex !== undefined) {
          makeMove(bestIndex, 'O');
        }
      }, 450);
    }

    function getRandomMove() {
      const emptyIndices = state.board
        .map((val, idx) => (val === '' ? idx : null))
        .filter(val => val !== null);

      if (emptyIndices.length === 0) return -1;
      return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
    }

    // Immediate win or block check heuristic
    function getSmartMove() {
      const emptyIndices = state.board
        .map((val, idx) => (val === '' ? idx : null))
        .filter(val => val !== null);

      // 1. Can AI win in 1 move?
      for (let idx of emptyIndices) {
        const boardCopy = [...state.board];
        boardCopy[idx] = 'O';
        if (checkWin(boardCopy, state.boardSize, state.winningLength)) {
          return idx;
        }
      }

      // 2. Can Player X win in 1 move? Block it!
      for (let idx of emptyIndices) {
        const boardCopy = [...state.board];
        boardCopy[idx] = 'X';
        if (checkWin(boardCopy, state.boardSize, state.winningLength)) {
          return idx;
        }
      }

      // 3. Prefer center cell
      const center = Math.floor(state.board.length / 2);
      if (state.board[center] === '') return center;

      return null;
    }

    // Minimax Algorithm for 3x3 Unbeatable AI
    function getMinimaxMove() {
      let bestScore = -Infinity;
      let bestMove = -1;

      for (let i = 0; i < state.board.length; i++) {
        if (state.board[i] === '') {
          state.board[i] = 'O';
          let score = minimax(state.board, 0, false);
          state.board[i] = '';
          if (score > bestScore) {
            bestScore = score;
            bestMove = i;
          }
        }
      }
      return bestMove;
    }

    function minimax(board, depth, isMaximizing) {
      const winResult = checkWin(board, 3, 3);
      if (winResult) {
        return winResult.winner === 'O' ? 10 - depth : depth - 10;
      }
      if (board.every(c => c !== '')) return 0;

      if (isMaximizing) {
        let bestScore = -Infinity;
        for (let i = 0; i < board.length; i++) {
          if (board[i] === '') {
            board[i] = 'O';
            let score = minimax(board, depth + 1, false);
            board[i] = '';
            bestScore = Math.max(score, bestScore);
          }
        }
        return bestScore;
      } else {
        let bestScore = Infinity;
        for (let i = 0; i < board.length; i++) {
          if (board[i] === '') {
            board[i] = 'X';
            let score = minimax(board, depth + 1, true);
            board[i] = '';
            bestScore = Math.min(score, bestScore);
          }
        }
        return bestScore;
      }
    }

    /* ==========================================
       5. EVENT LISTENERS & INITIALIZATION
       ========================================== */

    // Game Mode Switch (PvP vs AI)
    modePvP.addEventListener('click', () => {
      sound.playClick();
      state.mode = 'pvp';
      modePvP.className = 'flex-1 py-2 rounded-lg text-sm font-semibold transition bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 shadow-sm';
      modeAI.className = 'flex-1 py-2 rounded-lg text-sm font-semibold transition text-slate-400 hover:text-slate-200';
      aiDiffContainer.classList.add('opacity-50', 'pointer-events-none');
      playerOLabel.textContent = 'Player O';
      initBoard();
    });

    modeAI.addEventListener('click', () => {
      sound.playClick();
      state.mode = 'ai';
      modeAI.className = 'flex-1 py-2 rounded-lg text-sm font-semibold transition bg-pink-500/20 text-pink-300 border border-pink-500/40 shadow-sm';
      modePvP.className = 'flex-1 py-2 rounded-lg text-sm font-semibold transition text-slate-400 hover:text-slate-200';
      aiDiffContainer.classList.remove('opacity-50', 'pointer-events-none');
      playerOLabel.textContent = 'Computer';
      initBoard();
    });

    aiDifficultySelect.addEventListener('change', (e) => {
      sound.playClick();
      state.aiDifficulty = e.target.value;
      initBoard();
    });

    gridSizeSelect.addEventListener('change', () => {
      sound.playClick();
      initBoard();
    });

    restartBtn.addEventListener('click', () => {
      sound.playClick();
      initBoard();
    });

    resetStatsBtn.addEventListener('click', () => {
      sound.playClick();
      state.scores = { X: 0, O: 0, ties: 0 };
      updateScoresUI();
      initBoard();
    });

    audioBtn.addEventListener('click', () => {
      sound.muted = !sound.muted;
      if (sound.muted) {
        audioOnIcon.classList.add('hidden');
        audioOffIcon.classList.remove('hidden');
      } else {
        audioOffIcon.classList.add('hidden');
        audioOnIcon.classList.remove('hidden');
        sound.playClick();
      }
    });

    // Start on load
    window.onload = () => {
      initBoard();
    };
  </script>
